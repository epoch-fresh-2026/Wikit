name: Release image
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and protected-branch ancestry
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - name: Reject incomplete implementations
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const stages = JSON.parse(fs.readFileSync('.github/implementation.json'));
          const required = ['backend', 'frontend', 'integration', 'container', 'release_ready'];
          if (!required.every((name) => stages[name] === true)) {
            throw new Error('All implementation stages and release readiness must be complete.');
          }
          if (!fs.existsSync('docs/quality/release-readiness.md')) throw new Error('Missing release evidence.');
          JS
  validation:
    needs: readiness
    uses: ./.github/workflows/ci.yml
  publish:
    name: Publish GHCR image
    needs: [readiness, validation]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
      - name: Verify registry tags and pull immutable artifact
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          for tag in "$GITHUB_REF_NAME" "sha-$GITHUB_SHA"; do
            actual=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r '.digest')
            test "$actual" = "$DIGEST"
            echo "Verified $IMAGE:$tag -> $actual"
          done
          docker pull "$IMAGE@$DIGEST"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          docker tag "$IMAGE@$DIGEST" wikit:ci
      - name: Accept the published image in isolated Compose
        run: bash scripts/smoke.sh
        env:
          WIKIT_IMAGE: wikit:ci
      - name: Record published-image acceptance evidence
        if: always()
        run: |
          if test -f .local/acceptance/run.log; then
            tail -n 80 .local/acceptance/run.log >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record release artifact
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Version: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Image: $IMAGE@$DIGEST"
            echo "Deployment remains a manual site-maintainer action."
          } >> "$GITHUB_STEP_SUMMARY"
