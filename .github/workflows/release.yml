name: Release image
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and protected-branch ancestry
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - name: Reject incomplete implementations
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const stages = JSON.parse(fs.readFileSync('.github/implementation.json'));
          const required = ['backend', 'frontend', 'integration', 'container', 'release_ready'];
          if (!required.every((name) => stages[name] === true)) {
            throw new Error('All implementation stages and release readiness must be complete.');
          }
          if (!fs.existsSync('docs/release-readiness.md')) throw new Error('Missing release evidence.');
          JS
  validation:
    needs: readiness
    uses: ./.github/workflows/ci.yml
  publish:
    name: Publish GHCR image
    needs: [readiness, validation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
      - name: Record release artifact
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Version: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Image: $IMAGE@$DIGEST"
            echo "Deployment remains a manual site-maintainer action."
          } >> "$GITHUB_STEP_SUMMARY"
