name: 缺陷
description: 可复现问题与预期行为
labels: ["type:bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 版本、环境与复现步骤
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 实际结果与预期结果
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: 设计影响与验收条件
      description: 链接预期行为对应的需求、业务规则、模块或接口文档章节，列出可验证条件；文档正文不登记本 Issue。
    validations:
      required: true
